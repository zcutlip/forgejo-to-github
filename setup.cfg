[flake8]
; extend-ignore = E501, W504, E302, E221
extend-ignore = E501, E203
; per-file-ignores =
;     __init__.py:F401

[isort]
multi_line_output = 3

[mypy]
; (?x) lets us do multi-line exclude, with optional comments
exclude=(?x)(
    tests|
    build|
    setup.py)
warn_unused_ignores = True
implicit_optional = True
strict_optional = False

[coverage:run]
omit =
    tests/*
    */__init__.py
