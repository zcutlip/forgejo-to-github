[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgejo-to-github"
dynamic = ["version"]
description = "Migrate repos from Codeberg/Forgejo to GitHub: issues, comments, labels, git mirror"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["requests"]

[project.optional-dependencies]
dev = [
    "mypy",
    "types-requests",
    "pytest",
    "pytest-xdist"]

[project.scripts]
f2gh = "f2gh:main"

[tool.setuptools]
py-modules = ["f2gh"]
packages = ["forgejo_to_github"]

[tool.setuptools.dynamic]
version = {attr = "forgejo_to_github.__about__.__version__"}

[tool.pytest.ini_options]
addopts = "-n auto"
testpaths = ["tests"]
pythonpath = ["."]
